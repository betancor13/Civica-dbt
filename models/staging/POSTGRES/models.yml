version: 2                                      # Define la versión del esquema de dbt (siempre debe ser 2).

models:                                         # Comienza la lista de todos los modelos que vas a documentar.

  - name: stg_POSTGRES__PRODUCTS                # Nombre exacto del archivo .sql en tu carpeta. [cite: 10]
    config:                                     # Sección para configuraciones específicas de este modelo.
      contract:                                 # Define un "contrato de datos".
        enforced: true                          # Si los datos reales no coinciden EXACTAMENTE con este YAML, el proceso falla.
    description: >                              # Descripción larga para la documentación.
      Datos sobre todos los productos en la demostración.
    columns:                                    # Definición de cada columna de la tabla.
      - name: product_id                        # Nombre de la columna tal cual sale del SQL. 
        data_type: text                         # Tipo de dato para validar el contrato.
        description: "UUID para cada producto único."
        data_tests:                             # Pruebas de calidad automáticas.
          - not_null
          - unique
        constraints:
          - type: not_null                      # Restricción física en Snowflake.
      - name: name                              # Nombre original en Postgres. 
        data_type: text
        constraints:
          - type: not_null
      - name: price                             # Columna de precio. 
        data_type: real
        constraints:
          - type: not_null
      - name: inventory                         # Cantidad en stock. 
        data_type: number
        constraints:
          - type: not_null
      - name: _fivetran_deleted                 # Columna técnica de Fivetran. 
        data_type: boolean
      - name: _fivetran_synced                  # Fecha de sincronización. 
        data_type: timestamp_tz
        constraints:
          - type: not_null

  - name: stg_POSTGRES__ADDRESSES               # Segundo modelo: Direcciones.
    config:                                     # Añadido: Obligatorio para usar constraints.
      contract:
        enforced: true
    description: "Datos limpios de las direcciones."
    columns:
      - name: address_id
        data_type: text
        data_tests:
          - not_null
          - unique
        constraints:
          - type: not_null
      - name: address
        data_type: text
        constraints:
          - type: not_null
      - name: zipcode
        data_type: number
      - name: state
        data_type: text
      - name: country
        data_type: text
      - name: _fivetran_deleted                 # Añadido: Debe estar en el YAML si está en el SQL.
        data_type: boolean
      - name: _fivetran_synced
        data_type: timestamp_tz

  - name: stg_POSTGRES__ORDERS                  # Tercer modelo: Pedidos.
    config:
      contract:
        enforced: true
    columns:
      - name: order_id
        data_type: text
        data_tests:
          - not_null
          - unique
        constraints:
          - type: not_null
      - name: shipping_service
        data_type: text
      - name: shipping_cost
        data_type: real
      - name: address_id                        # Foreign Key hacia addresses.
        data_type: text
        constraints:
          - type: not_null
      - name: created_at
        data_type: timestamp_tz
      - name: promo_id                          # Foreign Key hacia promos.
        data_type: text
      - name: estimated_delivery_at
        data_type: timestamp_tz
      - name: order_cost
        data_type: real
      - name: user_id                           # Foreign Key hacia users.
        data_type: text
        constraints:
          - type: not_null
      - name: order_total
        data_type: real
      - name: delivered_at
        data_type: timestamp_tz
      - name: tracking_id
        data_type: text
      - name: status
        data_type: text
      - name: _fivetran_deleted
        data_type: boolean
      - name: _fivetran_synced
        data_type: timestamp_tz

  - name: stg_POSTGRES__ORDERITEMS              # Cuarto modelo: Detalle de ítems.
    config:
      contract:
        enforced: true
    columns:
      - name: order_id
        data_type: text
        data_tests:
          - not_null
        constraints:
          - type: not_null
      - name: product_id
        data_type: text
        data_tests:
          - not_null
        constraints:
          - type: not_null
      - name: quantity
        data_type: number
      - name: _fivetran_deleted
        data_type: boolean
      - name: _fivetran_synced
        data_type: timestamp_tz

  - name: stg_POSTGRES__PROMOS                  # Quinto modelo: Promociones.
    config:
      contract:
        enforced: true
    columns:
      - name: promo_id
        data_type: text
        data_tests:
          - not_null
          - unique
        constraints:
          - type: not_null
      - name: discount
        data_type: number
      - name: status
        data_type: text
      - name: _fivetran_deleted
        data_type: boolean
      - name: _fivetran_synced
        data_type: timestamp_tz

  - name: stg_POSTGRES__USER                    # Sexto modelo: Usuarios.
    config:
      contract:
        enforced: true
    columns:
      - name: user_id
        data_type: text
        data_tests:
          - not_null
          - unique
        constraints:
          - type: not_null
      - name: first_name
        data_type: text
      - name: last_name
        data_type: text
      - name: email
        data_type: text
      - name: phone_number
        data_type: text
      - name: address_id
        data_type: text
      - name: total_orders
        data_type: number
      - name: created_at
        data_type: timestamp_tz
      - name: updated_at
        data_type: timestamp_tz
      - name: _fivetran_deleted
        data_type: boolean
      - name: _fivetran_synced
        data_type: timestamp_tz