version: 2

models:

  - name: stg_POSTGRES__PRODUCTS
    description: "Datos sobre todos los productos en la demostración."
    columns:
      - name: product_id
        description: "UUID para cada producto único."
        data_tests:
          - not_null
          - unique
      - name: name
        data_tests:
          - not_null
      - name: price
        data_tests:
          - not_null
      - name: inventory
      - name: _fivetran_deleted
      - name: _fivetran_synced
        data_tests:
          - not_null

  - name: stg_POSTGRES__ADDRESSES
    description: "Datos limpios de las direcciones."
    columns:
      - name: address_id
        data_tests:
          - not_null
          - unique
      - name: address
        data_tests:
          - not_null
      - name: zipcode
      - name: state
      - name: country
      - name: _fivetran_deleted
      - name: _fivetran_synced

  - name: stg_POSTGRES__ORDERS
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique
      - name: shipping_service
      - name: shipping_cost
      - name: address_id
        data_tests:
          - not_null
      - name: created_at
      - name: promo_id
      - name: estimated_delivery_at
      - name: order_cost
      - name: user_id
        data_tests:
          - not_null
      - name: order_total
      - name: delivered_at
      - name: tracking_id
      - name: status
      - name: _fivetran_deleted
      - name: _fivetran_synced

  - name: stg_POSTGRES__ORDERITEMS
    columns:
      - name: order_id
        data_tests:
          - not_null
      - name: product_id
        data_tests:
          - not_null
      - name: quantity
      - name: _fivetran_deleted
      - name: _fivetran_synced

  - name: stg_POSTGRES__PROMOS
    columns:
      - name: promo_id
        data_tests:
          - not_null
          - unique
      - name: discount
      - name: status
      - name: _fivetran_deleted
      - name: _fivetran_synced

  - name: stg_POSTGRES__USER
    columns:
      - name: user_id
        data_tests:
          - not_null
          - unique
      - name: first_name
      - name: last_name
      - name: email
      - name: phone_number
      - name: address_id
      - name: total_orders
      - name: created_at
      - name: updated_at
      - name: _fivetran_deleted
      - name: _fivetran_synced